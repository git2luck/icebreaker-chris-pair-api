# Fly.io deployment configuration
# Deploy: fly deploy

app = "icebreaker-backend"
primary_region = "iad"

[build]
  builder = "paketobuildpacks/builder:base"

[env]
  DATABASE_PATH = "/data/icebreaker.db"
  SCRAPE_INTERVAL_MINUTES = "15"
  APNS_KEY_PATH = "/data/AuthKey.p8"
  APNS_PRODUCTION = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[services]]
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    path = "/health"

[mounts]
  source = "icebreaker_data"
  destination = "/data"
