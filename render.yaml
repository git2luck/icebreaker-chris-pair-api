# Render deployment configuration (FREE TIER)
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: icebreaker-chris-pair-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: DATABASE_PATH
        value: ./icebreaker.db
      - key: APNS_KEY_ID
        sync: false
      - key: APNS_TEAM_ID
        sync: false
      - key: APNS_KEY_PATH
        sync: false
      - key: APNS_BUNDLE_ID
        sync: false
      - key: APNS_PRODUCTION
        value: "false"
      - key: ADMIN_API_KEY
        generateValue: true
      - key: SCRAPE_INTERVAL_MINUTES
        value: "15"
